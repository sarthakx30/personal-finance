    <path d="M448 112h-85.33c-31.9 0-59.7 21.6-66.8 51.6l-8.8 37.1c-2.3 9.6-10.8 16.6-20.7 17.2-12.4.7-22.3-9.1-22.3-21.4V112c0-35.3-28.7-64-64-64H64C28.7 48 0 76.7 0 112v288c0 35.3 28.7 64 64 64h384c35.3 0 64-28.7 64-64V176c0-35.3-28.7-64-64-64z" fill="#ffffff" fill-opacity="0.2"/>
    
